name: Desktop CI

on:
  push:
    branches: [main, codex/windows-preview]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets --features custom-protocol --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test
        run: cargo +stable test --locked --all-targets --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Verify app packaging
        run: |
          RUSTUP_TOOLCHAIN=stable ./scripts/bundle.sh
          codesign --verify --strict release/Voxa.app
      - name: Package macOS release
        if: github.ref_type == 'tag'
        run: |
          set -eu
          version="$(plutil -extract CFBundleShortVersionString raw -o - release/Voxa.app/Contents/Info.plist)"
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent release/Voxa.app "dist/Voxa-$GITHUB_REF_NAME-macOS-arm64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag'
        with:
          name: release-macos
          path: dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Lint
        run: cargo +stable clippy --locked --all-targets --features custom-protocol --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test
        run: cargo +stable test --locked --all-targets --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Build Windows preview
        run: cargo +stable build --locked --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: Voxa-Windows-x64-preview
          path: src-tauri/target/release/voxa.exe
          if-no-files-found: error

      - name: Package Windows release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "The version in tauri.conf.json must match the tag"
          }
          $exe = Get-Item src-tauri/target/release/voxa.exe
          if ($exe.VersionInfo.ProductVersion -ne $version) {
            throw "The executable product version must match the release"
          }
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path $exe.FullName -DestinationPath "dist/Voxa-${env:GITHUB_REF_NAME}-Windows-x64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag'
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          cd dist
          mac="Voxa-$GITHUB_REF_NAME-macOS-arm64.zip"
          windows="Voxa-$GITHUB_REF_NAME-Windows-x64.zip"
          test -s "$mac"
          test -s "$windows"
          sha256sum "$mac" "$windows" > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          - **macOS 14.2+ · Apple Silicon.** Extract the ZIP and open Voxa.app. The app is ad hoc signed for testing.
          - **Windows 11 · x64 preview.** Extract the ZIP and open voxa.exe with Microsoft Edge WebView2 installed. The executable is unsigned. For microphone translation in meetings, use VB-CABLE.
          - **SHA256SUMS.txt** lists the checksums for both downloads.

          See the [setup guide](https://github.com/hiimbomb1999/voxa#build-and-run) for audio routing and API keys. Windows audio routing still needs validation in live calls on physical devices.
          EOF
          gh release create "$GITHUB_REF_NAME" "$mac" "$windows" SHA256SUMS.txt \
            --verify-tag --prerelease --title "Voxa $GITHUB_REF_NAME" --notes-file release-notes.md

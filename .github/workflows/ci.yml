name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets --features custom-protocol --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test
        run: cargo +stable test --locked --all-targets --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Verify app packaging
        run: |
          RUSTUP_TOOLCHAIN=stable ./scripts/bundle.sh
          codesign --verify --strict release/Voxa.app

[package]
name = "voxa"
version = "0.1.0"
edition = "2021"
description = "Live audio translation for macOS"
license = "MIT"
repository = "https://github.com/hiimbomb1999/voxa"
publish = false

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.15"
crossbeam-queue = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.42", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"

[features]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "voxa"
version = "0.1.13"
edition = "2021"
description = "Live desktop audio translation"
license = "MIT"
repository = "https://github.com/hiimbomb1999/voxa"
publish = false

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.15"
crossbeam-queue = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rfd = { version = "0.15", default-features = false }
wasapi = "0.27"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
